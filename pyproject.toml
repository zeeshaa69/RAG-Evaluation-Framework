[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval"
version = "0.1.0"
description = "Reproducible, offline-first evaluation of Retrieval-Augmented Generation systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.5"]
embeddings = ["sentence-transformers>=2.7"]

[project.scripts]
rag-eval = "rag_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_eval = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/rag_eval", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[[tool.mypy.overrides]]
module = ["sentence_transformers"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"src/rag_eval/report.py" = ["E501"]
